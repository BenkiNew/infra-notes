name: Перевірка змін та секретів

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Регрес доказу справжнього огляду
        run: node --test .github/tests/review-evidence.test.cjs
      - name: Інструмент читання YAML
        run: python -I -m pip install PyYAML==6.0.3
      - name: Регрес перевірки без виконання коду проєкту
        run: python -I -m unittest discover -s .github/tests -p test_change_guard.py
      - name: Синтаксис змінених файлів та Git diff
        run: python -I .github/scripts/change_guard.py
      - name: Перевірка нових комітів на секрети
        shell: bash
        run: |
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$BASE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            span="--text --diff-merges=separate $BASE_SHA..$HEAD_SHA"
          else
            span="--text --diff-merges=separate $HEAD_SHA"
          fi
          config="$RUNNER_TEMP/guard-gitleaks.toml"
          ignore="$RUNNER_TEMP/guard-empty.gitleaksignore"
          curl --fail --silent --show-error --location --retry 3 \
            https://raw.githubusercontent.com/gitleaks/gitleaks/83d9cd684c87d95d656c1458ef04895a7f1cbd8e/config/gitleaks.toml \
            --output "$config"
          echo "e163e53b9e7e8a8511e77271e2b323ed057759542a6d988258afe3a1fa329caf  $config" | sha256sum --check --status
          : > "$ignore"
          GITLEAKS_BINARY="$RUNNER_TEMP/gitleaks" GITLEAKS_CONFIG_TRUSTED="$config" \
            GITLEAKS_IGNORE_TRUSTED="$ignore" \
            python -I -m unittest discover -s .github/tests -p test_gitleaks_guard.py
          # Gitleaks також автоматично читає кореневий ignore попри явний -i.
          # Видаляється лише цей файл у тимчасовому checkout; каталог спричинить помилку.
          if [[ -e .gitleaksignore || -L .gitleaksignore ]]; then
            rm -- .gitleaksignore
          fi
          "$RUNNER_TEMP/gitleaks" git --config="$config" --gitleaks-ignore-path="$ignore" \
            --ignore-gitleaks-allow --redact=100 --no-banner --exit-code=1 --log-opts="$span" .
