name: Довірена перевірка PR

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  statuses: write

concurrency:
  group: trusted-repository-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  trusted-repository-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Позначити точний head як перевірюваний
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const sha = context.payload.pull_request.head.sha;
            if (!/^[0-9a-f]{40}$/.test(sha)) throw new Error('Invalid head SHA');
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha, state: 'pending', context: 'trusted-repository-guard/status',
              description: 'Довірена перевірка точного head триває',
              target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - name: Прочитати кандидата в окремий checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          allow-unsafe-pr-checkout: true
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Інструмент читання YAML
        run: python -I -m pip install PyYAML==6.0.3
      - name: Регрес перевірки без виконання коду проєкту
        run: python -I -m unittest discover -s trusted/.github/tests -p test_change_guard.py
      - name: Синтаксис змінених файлів та Git diff
        working-directory: candidate
        run: |
          actual=$(git rev-parse HEAD)
          test "$actual" = "$HEAD_SHA"
          python -I ../trusted/.github/scripts/change_guard.py
      - name: Перевірка нових комітів на секрети
        shell: bash
        working-directory: candidate
        run: |
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$BASE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            span="--text --diff-merges=first-parent $BASE_SHA..$HEAD_SHA"
          else
            span="--text --diff-merges=first-parent $HEAD_SHA"
          fi
          config="$RUNNER_TEMP/guard-gitleaks.toml"
          ignore="$RUNNER_TEMP/guard-empty.gitleaksignore"
          curl --fail --silent --show-error --location --retry 3 \
            https://raw.githubusercontent.com/gitleaks/gitleaks/83d9cd684c87d95d656c1458ef04895a7f1cbd8e/config/gitleaks.toml \
            --output "$config"
          echo "e163e53b9e7e8a8511e77271e2b323ed057759542a6d988258afe3a1fa329caf  $config" | sha256sum --check --status
          : > "$ignore"
          GITLEAKS_BINARY="$RUNNER_TEMP/gitleaks" GITLEAKS_CONFIG_TRUSTED="$config" \
            GITLEAKS_IGNORE_TRUSTED="$ignore" \
            python -I -m unittest discover -s ../trusted/.github/tests -p test_gitleaks_guard.py
          # Gitleaks також автоматично читає кореневий ignore попри явний -i.
          # Видаляється лише цей файл у тимчасовому checkout; каталог спричинить помилку.
          if [[ -e .gitleaksignore || -L .gitleaksignore ]]; then
            rm -- .gitleaksignore
          fi
          "$RUNNER_TEMP/gitleaks" git --config="$config" --gitleaks-ignore-path="$ignore" \
            --ignore-gitleaks-allow --redact=100 --no-banner --exit-code=1 --log-opts="$span" .
      - name: Зафіксувати фактичний результат для head PR
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GUARD_JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const sha = context.payload.pull_request.head.sha;
            if (!/^[0-9a-f]{40}$/.test(sha)) throw new Error('Invalid head SHA');
            const success = process.env.GUARD_JOB_STATUS === 'success';
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha, state: success ? 'success' : 'failure',
              context: 'trusted-repository-guard/status',
              description: success ? 'Точний head перевірено довіреним кодом' : 'Довірена перевірка не завершилася успішно',
              target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
